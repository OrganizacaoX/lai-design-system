name: AUT P05 Python Supply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-wheelhouse:
    if: startsWith(github.head_ref, 'aut/p05-python-supply')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact locked wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p05-wheelhouse/wheelhouse
          cat > p05-wheelhouse/requirements-lock.txt <<'REQ'
          anyio==4.14.2
          attrs==26.1.0
          certifi==2026.7.22
          colorama==0.4.6
          h11==0.16.0
          httpcore==1.0.9
          httpx==0.28.1
          idna==3.18
          iniconfig==2.3.0
          jsonschema==4.26.0
          jsonschema-specifications==2025.9.1
          packaging==26.3
          pluggy==1.6.0
          psutil==7.2.2
          pygments==2.21.0
          pytest==9.0.2
          referencing==0.37.0
          rpds-py==2026.6.3
          typing-extensions==4.16.0
          setuptools==82.0.1
          wheel==0.46.3
          REQ
          python -m pip download --only-binary=:all: --dest p05-wheelhouse/wheelhouse -r p05-wheelhouse/requirements-lock.txt
          (cd p05-wheelhouse/wheelhouse && sha256sum * | sort > ../WHEELHOUSE_SHA256SUMS.txt)
          python - <<'PY'
          import json, pathlib, platform, subprocess, sys
          root=pathlib.Path('p05-wheelhouse')
          wheels=sorted(p.name for p in (root/'wheelhouse').iterdir() if p.is_file())
          m={
            'schema':'lai.p05.python-wheelhouse.v1',
            'python':sys.version,
            'platform':platform.platform(),
            'pip':subprocess.check_output([sys.executable,'-m','pip','--version'],text=True).strip(),
            'wheel_count':len(wheels),
            'wheels':wheels,
          }
          (root/'MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Prove offline install from wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m venv p05-wheelhouse/probe-venv
          p05-wheelhouse/probe-venv/bin/python -m pip install --no-index --find-links p05-wheelhouse/wheelhouse -r p05-wheelhouse/requirements-lock.txt
          p05-wheelhouse/probe-venv/bin/python - <<'PY' > p05-wheelhouse/OFFLINE_INSTALL_PROOF.txt
          import importlib.metadata as m
          expected={
          'anyio':'4.14.2','attrs':'26.1.0','certifi':'2026.7.22','h11':'0.16.0','httpcore':'1.0.9','httpx':'0.28.1','idna':'3.18','iniconfig':'2.3.0','jsonschema':'4.26.0','jsonschema-specifications':'2025.9.1','packaging':'26.3','pluggy':'1.6.0','psutil':'7.2.2','pygments':'2.21.0','pytest':'9.0.2','referencing':'0.37.0','rpds-py':'2026.6.3','typing-extensions':'4.16.0','setuptools':'82.0.1','wheel':'0.46.3'}
          for k,v in expected.items():
              got=m.version(k)
              assert got==v,(k,got,v)
              print(f'{k}=={got}')
          print('OFFLINE_INSTALL=PASS')
          PY
          rm -rf p05-wheelhouse/probe-venv
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: p05-python-wheelhouse-linux-cp313
          path: p05-wheelhouse
          if-no-files-found: error
          retention-days: 1
