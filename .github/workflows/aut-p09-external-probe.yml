name: AUT P09 External Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'aut/p09-external-probe')
    runs-on: ubuntu-latest
    steps:
      - name: Probe public LAI service surfaces without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p09-probe
          python3 - <<'PY'
          import json, hashlib, subprocess, time
          targets = {
            'gateway_health': ('GET','https://gateway.lai.ia.br/health',None),
            'gateway_rag_search': ('GET','https://gateway.lai.ia.br/v1/collections/shelf-kb-franquia/search?query=franquia&limit=1',None),
            'meetcore_health': ('GET','https://api.meetcore.lai.ia.br/health',None),
            'meetcore_openapi': ('GET','https://api.meetcore.lai.ia.br/openapi.json',None),
            'studio_health': ('GET','https://api.studio.lai.ia.br/health',None),
            'sentinela_health': ('GET','https://sentinela.lai.ia.br/health',None),
            'sentinela_models': ('GET','https://sentinela.lai.ia.br/v1/models',None),
            'inference_health': ('GET','https://inference.lai.ia.br/health',None),
            'inference_openapi': ('GET','https://inference.lai.ia.br/openapi.json',None),
            'inference_embed_unauth': ('POST','https://inference.lai.ia.br/embed','{"texts":["probe"]}'),
            'llm_health': ('GET','https://llm.lai.ia.br/health',None),
            'llm_models': ('GET','https://llm.lai.ia.br/v1/models',None),
            'llm_chat_unauth': ('POST','https://llm.lai.ia.br/v1/chat/completions','{"model":"sentinela-base","messages":[{"role":"user","content":"probe"}],"max_tokens":1,"temperature":0}'),
          }
          out={'schema':'lai.p09.external-probe.v3','generated_at_unix':time.time(),'targets':{}}
          for name,(method,url,data) in targets.items():
              body=f'/tmp/{name}.body'; hdr=f'/tmp/{name}.hdr'
              cmd=['curl','-sS','-L','--max-time','20']
              if method=='POST':
                  cmd += ['-X','POST','-H','Content-Type: application/json','--data',data or '{}']
              cmd += ['-D',hdr,'-o',body,'-w','%{http_code}\n%{remote_ip}\n%{time_total}\n%{content_type}',url]
              p=subprocess.run(cmd,text=True,capture_output=True)
              rec={'url':url,'method':method,'exit':p.returncode,'stderr':p.stderr[-500:]}
              if p.returncode==0:
                  lines=p.stdout.splitlines(); rec.update({'http_code':lines[0] if lines else None,'remote_ip':lines[1] if len(lines)>1 else None,'time_total':lines[2] if len(lines)>2 else None,'content_type':lines[3] if len(lines)>3 else None})
                  try:
                      b=open(body,'rb').read(); rec['body_bytes']=len(b); rec['body_sha256']=hashlib.sha256(b).hexdigest()
                      if name=='inference_health' and len(b)<200000:
                          try:
                              j=json.loads(b); rec['safe_health_fields']={k:j.get(k) for k in ('status','embedding_model','reranker_model') if k in j}
                          except Exception: rec['health_parse']='not_json_or_schema_mismatch'
                      if name.endswith('_models') and len(b)<2000000:
                          try:
                              j=json.loads(b); ids=[]
                              if isinstance(j,dict):
                                  for x in j.get('data',[]):
                                      if isinstance(x,dict) and isinstance(x.get('id'),str): ids.append(x['id'])
                              rec['model_ids']=sorted(set(ids))[:100]
                          except Exception: rec['models_parse']='not_json_or_schema_mismatch'
                      if name in {'meetcore_openapi','inference_openapi'} and len(b)<5000000:
                          try:
                              j=json.loads(b); rec['openapi_title']=j.get('info',{}).get('title'); rec['openapi_version']=j.get('info',{}).get('version'); rec['paths']=sorted(j.get('paths',{}).keys())[:500]; rec['path_count']=len(j.get('paths',{}))
                          except Exception: rec['openapi_parse']='not_json_or_schema_mismatch'
                  except Exception as e: rec['body_error']=type(e).__name__
              out['targets'][name]=rec
          open('p09-probe/EXTERNAL_PROBE.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: p09-external-probe
          path: p09-probe/EXTERNAL_PROBE.json
          if-no-files-found: error
          retention-days: 1
