name: Validate design system
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_PASSWORD: ci-site-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun test ./tests/navigation-menu-css.test.ts
      - name: Verify generated artifacts
        run: |
          if [ -n "$(git status --porcelain -- registry.json public/r site/catalog.json site/test-source.json)" ]; then
            git status --short -- registry.json public/r site/catalog.json site/test-source.json
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: bun test ./tests/site-auth.test.ts ./tests/component-reliability.test.ts
      - run: npm run test:reliability-unit
      - run: npm run test:reliability
      - name: Preserve component reliability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-reliability
          path: |
            public/component-tests.json
            test-results/reliability/
      - run: npm run test:consumers
      - run: npm run test:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
