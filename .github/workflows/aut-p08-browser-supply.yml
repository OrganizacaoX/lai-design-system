name: AUT P08 Browser Supply

on:
  push:
    branches:
      - aut/p08-browser-supply-trigger

permissions:
  contents: read

jobs:
  supply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/p08-browser/browsers"
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, pathlib, subprocess
          root=pathlib.Path('p08-browser')
          with sync_playwright() as p:
              exe=pathlib.Path(p.chromium.executable_path).resolve()
              version=subprocess.check_output([str(exe),'--version'],text=True).strip()
              data={'schema':'lai.p08.browser-supply.v1','playwright':'1.57.0','executable':str(exe.relative_to(root.resolve())),'browser_version':version}
              (root/'MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
              print(json.dumps(data))
          PY
          (cd p08-browser && find browsers -type f -print0 | sort -z | xargs -0 sha256sum > BROWSER_SHA256SUMS.txt)
          tar -C p08-browser -czf p08-playwright-browser-linux-x64.tgz browsers MANIFEST.json BROWSER_SHA256SUMS.txt
          sha256sum p08-playwright-browser-linux-x64.tgz > p08-playwright-browser-linux-x64.tgz.sha256
          stat -c '%s' p08-playwright-browser-linux-x64.tgz > p08-playwright-browser-linux-x64.tgz.size
          sha256sum -c p08-playwright-browser-linux-x64.tgz.sha256
      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: p08-playwright-browser-linux-x64
          path: |
            p08-playwright-browser-linux-x64.tgz
            p08-playwright-browser-linux-x64.tgz.sha256
            p08-playwright-browser-linux-x64.tgz.size
          if-no-files-found: error
          retention-days: 1
