name: AUT G04 Vite Supply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply:
    if: startsWith(github.head_ref, 'aut/g04-vite-supply')
    runs-on: ubuntu-latest
    steps:
      - name: Build exact dependency artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir supply_work
          cd supply_work
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact vite@8.2.1 @vitejs/plugin-react@6.0.5
          V=$(node -p "require('./node_modules/vite/package.json').version")
          P=$(node -p "require('./node_modules/@vitejs/plugin-react/package.json').version")
          test "$V" = "8.2.1"
          test "$P" = "6.0.5"
          cd ..
          tar -czf vite-deps-linux-x64.tgz supply_work/node_modules supply_work/package.json supply_work/package-lock.json
          sha256sum vite-deps-linux-x64.tgz > vite-deps-linux-x64.tgz.sha256
          stat -c '%s' vite-deps-linux-x64.tgz > vite-deps-linux-x64.tgz.size
          printf '{"vite":"%s","plugin_react":"%s","node":"%s","npm":"%s"}\n' "$V" "$P" "$(node --version)" "$(npm --version)" > manifest.json
          sha256sum -c vite-deps-linux-x64.tgz.sha256
      - name: Upload exact dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: g04-vite-deps-linux-x64
          path: |
            vite-deps-linux-x64.tgz
            vite-deps-linux-x64.tgz.sha256
            vite-deps-linux-x64.tgz.size
            manifest.json
          if-no-files-found: error
          retention-days: 1
